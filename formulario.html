    <title>Contato</title>
    <link rel="stylesheet" href="styleform.css">
</head>

<body>

<section>
    <form action="https://flowform.to/ebonfimmlot@gmail.com" method="post">

        <h2>Contato</h2>

        <label>Nome</label>

    </form>
</section>
